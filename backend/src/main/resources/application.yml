spring:
  application:
    name: skill-management

  # ====================== Database Configuration ======================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:skill_management_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manages schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ====================== Flyway Migration ======================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ====================== Virtual Threads (Java 21) ======================
  threads:
    virtual:
      enabled: true

# ====================== JWT Configuration ======================
jwt:
  secret-key: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1tdXN0LWNoYW5nZS1pbi1wcm9kdWN0aW9u}
  expiration: 86400000  # 24 hours in milliseconds

# ====================== CORS Configuration ======================
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

# ====================== Actuator ======================
management:
  endpoints:
    web:
      exposure:
        include: health,info

# ====================== File Upload Configuration ======================
app:
  upload:
    dir: ${UPLOAD_DIR:uploads/avatars/}

server:
  port: 8080
